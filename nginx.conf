# =============================================================
#  HRMS — Nginx Configuration
#  Domain: hrs.sbpafrica.group / www.hrs.sbpafrica.group
#  App root: /var/www/hrms/public
# =============================================================

# ── Redirect HTTP → HTTPS (both bare + www) ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hrs.sbpafrica.group www.hrs.sbpafrica.group;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/hrms/public;
    }

    location / {
        return 301 https://hrs.sbpafrica.group$request_uri;
    }
}

# ── Redirect www → non-www (HTTPS) ───────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hrs.sbpafrica.group;

    ssl_certificate     /etc/letsencrypt/live/hrs.sbpafrica.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrs.sbpafrica.group/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hrs.sbpafrica.group$request_uri;
}

# ── Main HTTPS server block ───────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrs.sbpafrica.group;

    root  /var/www/hrms/public;
    index index.php;

    # ── SSL (Certbot / Let's Encrypt) ─────────────────────────
    ssl_certificate     /etc/letsencrypt/live/hrs.sbpafrica.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrs.sbpafrica.group/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Logging ────────────────────────────────────────────────
    access_log /var/log/nginx/hrms_access.log;
    error_log  /var/log/nginx/hrms_error.log;

    # ── Charset & limits ──────────────────────────────────────
    charset utf-8;
    client_max_body_size 64M;

    # ── Laravel — try files, fall back to index.php ───────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Static asset caching ──────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
        try_files   $uri =404;
    }

    # ── Vite build assets (fingerprinted — aggressive cache) ──
    location /build/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # ── PHP-FPM ───────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.2-fpm.sock;
        # If using PHP 8.3: unix:/var/run/php/php8.3-fpm.sock
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_read_timeout    300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout    300;
        fastcgi_buffer_size     128k;
        fastcgi_buffers         4 256k;
    }

    # ── Block .env, .git and hidden files ─────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.env {
        deny all;
        return 404;
    }

    # ── Block direct PHP execution outside public/ ────────────
    location ~* ^/(storage|bootstrap|app|config|database|resources|routes|tests)/ {
        deny all;
        return 404;
    }
}
